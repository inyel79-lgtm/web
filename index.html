<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelacak Device ID</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 40px;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        .device-box {
            background: #eef2f7;
            padding: 15px;
            font-family: monospace;
            font-size: 16px;
            border: 1px solid #ccd6e0;
            border-radius: 4px;
            word-break: break-all;
            margin: 20px 0;
            color: #333;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Informasi Perangkat Anda</h2>
    <p>Berikut adalah Device ID unik yang terdaftar untuk browser ini:</p>
    
    <!-- Tempat menampilkan Device ID -->
    <div id="device-id-display" class="device-box">Memuat Device ID...</div>
    
    <button onclick="salinDeviceID()">Salin Device ID</button>
</div>

<script>
    // Fungsi untuk membuat string acak (UUID v4 sederhana) sebagai Device ID
    function generateDeviceID() {
        return 'xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, 
                v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    // Fungsi utama untuk memeriksa dan mengambil Device ID
    function inisialisasiDevice() {
        // Coba ambil Device ID yang sudah tersimpan di browser
        let deviceId = localStorage.getItem('my_app_device_id');
        
        // Jika belum ada, buat baru dan simpan
        if (!deviceId) {
            deviceId = generateDeviceID();
            localStorage.setItem('my_app_device_id', deviceId);
            console.log("🆕 Device ID baru berhasil dibuat!");
        } else {
            console.log("🔄 Device ID lama dimuat dari penyimpanan.");
        }
        
        // Tampilkan ke layar HTML
        document.getElementById('device-id-display').innerText = deviceId;
        
        // Tampilkan juga di konsol browser
        console.log("Device ID: " + deviceId);
    }

    // Fungsi untuk tombol salin teks
    function salinDeviceID() {
        let textToCopy = document.getElementById('device-id-display').innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert("✅ Device ID berhasil disalin!");
        }).catch(err => {
            console.error("Gagal menyalin: ", err);
        });
    }

    // Jalankan fungsi otomatis saat halaman selesai dimuat
    window.onload = inisialisasiDevice;
</script>

</body>
</html>
